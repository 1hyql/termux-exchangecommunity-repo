<div class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></div>

<main class="content-container">

  <!-- 页头 + 搜索框（最上方） -->

  </div>

  <div class="dl-search-wrap">
    <div class="dl-search-box">
      <input id="searchInput" type="search" placeholder="输入关键词搜索软件包…" autocomplete="off" enterkeyhint="search" aria-label="搜索软件包">
      <button id="searchBtn" type="button" class="dl-search-btn">搜索</button>
    </div>
  </div>
  <p class="result-meta" id="pkgCount">加载中…</p>

  <!-- 推荐软件 -->
  <section class="card" id="recommendedSection" aria-labelledby="rec-title" hidden>

      <h2 id="rec-title" class="card-title"><span class="card-icon">⭐</span> 推荐软件</h2>
    </div>
    <div class="rec-grid" id="recommendedList">
      <div class="loading">加载中…</div>

  <!-- 全部软件包 -->
  <section class="card results" aria-labelledby="list-title">
    <div class="card-head">
      <h2 id="list-title" class="card-title"><span class="card-icon">📦</span> 全部软件包</h2>
